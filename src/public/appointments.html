<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HIS Citas — Gestión de citas</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>HIS <span>Citas</span></h1>
    <nav>
      <a href="/appointments.html" class="active">Sección Paciente</a>
      <a href="/schedules.html">Sección Administrador</a>
    </nav>
  </header>
  <main>
    <h2 style="font-size: 1.5rem; margin-bottom: 2rem;">Reservar Cita</h2>
    
    <div class="card">
      <h2>Identificación</h2>
      <div class="form-group">
        <select id="patient-id" required>
          <option value="">Cargando pacientes...</option>
        </select>
      </div>
    </div>

    <div class="card">
      <h2>Buscar Disponibilidad</h2>
      <form id="book-form">
        <div class="form-row">
          <div class="form-group">
            <label>Especialidad</label>
            <select id="specialty" required>
              <option value="Dermatología">Dermatología</option>
              <option value="Medicina General">Medicina General</option>
              <option value="Pediatría">Pediatría</option>
            </select>
          </div>
          <div class="form-group">
            <label>Centro Médico</label>
            <select id="center-id" required>
              <option value="CENTRO-1">Hospital Principal</option>
              <option value="CENTRO-2">Clínica Norte</option>
            </select>
          </div>
          <div class="form-group">
            <label>Fecha</label>
            <input type="date" id="date" required />
          </div>
          <div class="form-group">
            <button type="button" id="btn-search">Buscar Huecos</button>
          </div>
        </div>
      </form>
    </div>

    <div class="card" id="slots-card" style="display: none;">
      <h2>Huecos Disponibles</h2>
      <span class="subtitle">Dr. Lopez</span>
      <div id="slots-container" class="slots-grid"></div>
    </div>

    <div class="card" style="margin-top: 2rem;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 style="margin: 0;">Mis citas</h2>
        <button type="button" id="btn-load-appointments" style="background: transparent; border: 1px solid var(--border); color: var(--text);">Refrescar</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Especialidad</th>
            <th>Fecha y Hora</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="appointments-body">
          <tr><td colspan="4" class="muted">Selecciona un paciente arriba.</td></tr>
        </tbody>
      </table>
    </div>
  </main>
  <script type="module" src="/js/appointments.js"></script>
</body>
</html>
