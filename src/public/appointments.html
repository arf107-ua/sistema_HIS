<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HIS Citas — Gestión de citas</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 10h-5V5c0-1.1-.9-2-2-2s-2 .9-2 2v5H5c-1.1 0-2 .9-2 2s.9 2 2 2h5v5c0 1.1.9 2 2 2s2-.9 2-2v-5h5c1.1 0 2-.9 2-2s-.9-2-2-2z"/>
      </svg>
      <h1>HIS <span>Citas</span></h1>
    </div>
    <nav>
      <a href="/" class="nav-item"><span class="num">1</span> Buscar Paciente</a>
      <a href="/form.html" class="nav-item"><span class="num">2</span> Nuevo Paciente</a>
      <a href="/appointments.html" class="nav-item active"><span class="num">3</span> Gestión de Citas</a>
      <a href="/schedules.html" class="nav-item"><span class="num">4</span> Gestión de Agenda</a>
    </nav>
  </header>
  <main class="layout-sidebar">
    <div class="left-col">
      <div class="card" style="margin-bottom: 1.5rem;">
        <h2>Identificación</h2>
        <div class="form-group">
          <select id="patient-id" required>
            <option value="">Cargando pacientes...</option>
          </select>
        </div>
      </div>

      <div class="card" style="margin-bottom: 1.5rem;">
        <h2>Buscar Disponibilidad</h2>
        <form id="book-form">
          <div class="form-group">
            <label>Especialidad</label>
            <select id="specialty" required>
              <option value="Dermatología">Dermatología</option>
              <option value="Medicina General">Medicina General</option>
              <option value="Pediatría">Pediatría</option>
            </select>
          </div>
          <div class="form-group">
            <label>Centro Médico</label>
            <select id="center-id" required>
              <option value="CENTRO-1">Hospital Principal</option>
              <option value="CENTRO-2">Clínica Norte</option>
            </select>
          </div>
          <div class="form-group">
            <label>Fecha</label>
            <input type="date" id="date" required />
          </div>
          <div class="form-group" style="margin-top: 0.5rem;">
            <button type="button" id="btn-search" style="width: 100%;">Buscar Huecos</button>
          </div>
        </form>
      </div>
    </div>

    <div class="right-col">
      <div class="card" id="slots-card" style="display: none; margin-bottom: 1.5rem;">
        <h2>Huecos Disponibles</h2>
        <span class="subtitle">Dr. Lopez</span>
        <div id="slots-container" class="slots-grid"></div>
      </div>

      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
          <h2 style="margin: 0;">Mis citas</h2>
          <button type="button" id="btn-load-appointments" class="secondary" style="padding: 0.4rem 0.75rem; font-size: 0.85rem;">Refrescar</button>
        </div>
        <table style="margin-top: 0;">
          <thead>
            <tr>
              <th>Especialidad</th>
              <th>Fecha y Hora</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="appointments-body">
            <tr><td colspan="4" class="muted">Selecciona un paciente a la izquierda.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
  <script type="module" src="/js/appointments.js"></script>
</body>
</html>
