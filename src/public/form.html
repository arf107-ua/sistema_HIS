<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HIS — Alta y edición de paciente</title>
  <link rel="stylesheet" href="/styles.css" />
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/material_blue.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://npmcdn.com/flatpickr/dist/l10n/es.js"></script>
</head>
<body>
  <header>
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 10h-5V5c0-1.1-.9-2-2-2s-2 .9-2 2v5H5c-1.1 0-2 .9-2 2s.9 2 2 2h5v5c0 1.1.9 2 2 2s2-.9 2-2v-5h5c1.1 0 2-.9 2-2s-.9-2-2-2z"/>
      </svg>
      <h1>HIS <span>Clínica</span></h1>
    </div>
    <nav>
      <a href="/" class="nav-item"><span class="num">1</span> Buscar Paciente</a>
      <a href="/form.html" class="nav-item active"><span class="num">2</span> Nuevo Paciente</a>
      <a href="/appointments.html" class="nav-item"><span class="num">3</span> Gestión de Citas</a>
      <a href="/schedules.html" class="nav-item"><span class="num">4</span> Gestión de Agenda</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <h2 id="form-title">Alta de paciente</h2>
      <div id="identity-box" class="muted" hidden></div>

      <form id="patient-form">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
          
          <!-- Columna Izquierda -->
          <div style="display: flex; flex-direction: column; gap: 0.75rem;">
            <h3 class="section-title">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              1. Identidad y Registro
            </h3>
            <div class="form-row" style="grid-template-columns: 1fr 1.5fr;">
              <label>
                Tipo de documento
                <select name="documentType">
                  <option value="DNI">DNI</option>
                  <option value="NIE">NIE</option>
                  <option value="OTHER">Otro</option>
                </select>
              </label>
              <label>
                Documento de identidad <span class="req">*</span>
                <input type="text" name="documentNumber" placeholder="Ej: 12345678Z" required autocomplete="off" />
                <span class="helper-text">Formato según tipo seleccionado</span>
              </label>
            </div>

            <div class="form-row">
              <label>Nombre <span class="req">*</span><input type="text" name="firstName" maxlength="80" required autocomplete="given-name" /></label>
              <label>Apellidos <span class="req">*</span><input type="text" name="lastName" maxlength="120" required autocomplete="family-name" /></label>
            </div>

            <div class="form-row" style="grid-template-columns: 1fr 1fr;">
              <label>Fecha de Nacimiento<input type="date" name="birthDate" /></label>
              <label>Sexo
                <select name="sex">
                  <option value="">—</option>
                  <option value="F">Femenino (F)</option>
                  <option value="M">Masculino (M)</option>
                  <option value="O">Otro (O)</option>
                </select>
              </label>
            </div>
          </div>

          <!-- Columna Derecha -->
          <div style="display: flex; flex-direction: column; gap: 0.75rem;">
            <h3 class="section-title">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
              2. Datos de Contacto
            </h3>
            <div class="form-row" style="grid-template-columns: 1fr 1.5fr;">
              <label>Teléfono<input type="text" name="phone" placeholder="Ej: +34 600..." autocomplete="tel" /></label>
              <label>Email<input type="email" name="email" placeholder="Ej: usuario@correo.com" maxlength="120" autocomplete="email" /></label>
            </div>
            <label>
              Domicilio Completo
              <input type="text" name="address" maxlength="200" placeholder="Ej: Calle Principal 123..." autocomplete="street-address" />
            </label>

            <h3 class="section-title">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
              3. Cobertura Médica
            </h3>
            <div class="form-row">
              <label>Número seguro/mutua <span class="req">*</span>
                <input type="text" name="insuranceNumber" placeholder="Ej: 9988776655" maxlength="40" required autocomplete="off" />
              </label>
              <label>Aseguradora/mutua
                <input type="text" name="insurerName" placeholder="Ej: Sanitas" maxlength="80" autocomplete="organization" />
              </label>
            </div>
          </div>
        </div>

        <div class="actions" style="margin-top: 1rem; border-top: 1px solid var(--border); padding-top: 1rem; justify-content: flex-end;">
          <a href="/"><button type="button" class="secondary">Cancelar</button></a>
          <button type="submit" id="submit-btn">Registrar paciente</button>
        </div>

        <div id="msg" class="msg" role="status"></div>
      </form>
    </section>
  </main>

  <script type="module" src="/form.js"></script>
  <footer>
    <div class="footer-links">
      <a href="#">Soporte Técnico</a>
      <a href="#">Política de Privacidad</a>
      <a href="#">Términos de Uso</a>
    </div>
    <div class="footer-meta">
      <span>&copy; 2026 HIS Clínica</span>
      <span>v1.0.0</span>
    </div>
  </footer>
</body>
</html>
