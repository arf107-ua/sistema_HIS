<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HIS — Alta y edición de paciente</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 10h-5V5c0-1.1-.9-2-2-2s-2 .9-2 2v5H5c-1.1 0-2 .9-2 2s.9 2 2 2h5v5c0 1.1.9 2 2 2s2-.9 2-2v-5h5c1.1 0 2-.9 2-2s-.9-2-2-2z"/>
      </svg>
      <h1>HIS <span>Clínica</span></h1>
    </div>
    <nav>
      <a href="/" class="nav-item"><span class="num">1</span> Buscar Paciente</a>
      <a href="/form.html" class="nav-item active"><span class="num">2</span> Nuevo Paciente</a>
      <a href="/appointments.html" class="nav-item"><span class="num">3</span> Gestión de Citas</a>
      <a href="/schedules.html" class="nav-item"><span class="num">4</span> Gestión de Agenda</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <h2 id="form-title">Alta de paciente</h2>
      <div id="identity-box" class="muted" hidden></div>

      <form id="patient-form">
        <div class="form-row" style="grid-template-columns: 1fr 2fr;">
          <label>
            Tipo de documento
            <select name="documentType">
              <option value="DNI">DNI</option>
              <option value="NIE">NIE</option>
              <option value="OTHER">Otro</option>
            </select>
          </label>
          <label>
            Documento de identidad <span class="req">*</span>
            <input type="text" name="documentNumber" placeholder="12345678Z" required autocomplete="off" />
          </label>
        </div>

        <div class="form-row">
          <label>Nombre <span class="req">*</span><input type="text" name="firstName" maxlength="80" required autocomplete="given-name" /></label>
          <label>Apellidos <span class="req">*</span><input type="text" name="lastName" maxlength="120" required autocomplete="family-name" /></label>
        </div>

        <div class="form-row">
          <label>Número seguro/mutua <span class="req">*</span><input type="text" name="insuranceNumber" maxlength="40" required autocomplete="off" /></label>
          <label>Aseguradora/mutua<input type="text" name="insurerName" maxlength="80" autocomplete="organization" /></label>
        </div>

        <div class="form-row" style="grid-template-columns: 1fr 0.8fr 1.5fr 2fr;">
          <label>Nacimiento<input type="date" name="birthDate" /></label>
          <label>Sexo
            <select name="sex">
              <option value="">—</option>
              <option value="F">F</option>
              <option value="M">M</option>
              <option value="O">O</option>
            </select>
          </label>
          <label>Teléfono<input type="text" name="phone" placeholder="+34..." autocomplete="tel" /></label>
          <label>Email<input type="email" name="email" maxlength="120" autocomplete="email" /></label>
        </div>

        <label>
          Domicilio
          <input type="text" name="address" maxlength="200" autocomplete="street-address" />
        </label>

        <div class="actions">
          <button type="submit" id="submit-btn">Registrar paciente</button>
          <a href="/"><button type="button" class="secondary">Volver</button></a>
        </div>

        <div id="msg" class="msg" role="status"></div>
      </form>
    </section>
  </main>

  <script type="module" src="/form.js"></script>
</body>
</html>
